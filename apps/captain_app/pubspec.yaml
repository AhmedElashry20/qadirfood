name: captain_app
description: تطبيق الكابتن (السائق) — منصة توصيل الطلبات
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # للوصول إلى window وقراءة إعداد الـ API وقت التشغيل على الويب
  web: ^1.1.0
  flutter_localizations:
    sdk: flutter

  # الحالة والتنقل
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # الشبكة واللحظي
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  cached_network_image: ^3.4.1

  # الخرائط والموقع

  # النماذج (codegen)

  # الوسائط والتحقق
  # اختيار صور الوثائق من المعرض أو الكاميرا قبل رفعها على POST /uploads.
  image_picker: ^1.1.2

  # الواجهة

  # أدوات
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2 # GPS حقيقي لبث موقع الكابتن

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# أيقونة التطبيق — بتتولّد لكل مقاسات أندرويد و iOS من صورة واحدة.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1C1C1C"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
