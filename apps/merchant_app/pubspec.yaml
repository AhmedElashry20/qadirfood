name: merchant_app
description: "تطبيق المطعم — استقبال الطلبات وإدارتها (١٣ شاشة). تصميم تشغيلي للتابلت والموبايل."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── إدارة الحالة ──
  flutter_riverpod: ^2.5.1

  # ── التنقل ──
  go_router: ^14.2.7

  # ── الشبكة ──
  dio: ^5.7.0
  socket_io_client: ^2.0.3+1

  # ── النماذج (freezed + json_serializable) ──
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── التخزين ──
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # ── صوت التنبيه المتكرر ──
  audioplayers: ^6.1.0

  # ── حالة الاتصال (Offline) ──
  connectivity_plus: ^6.0.5

  # ── التقارير ──
  fl_chart: ^0.69.0

  # ── التعريب والتنسيق ──
  intl: ^0.20.2

  # ── متفرقات ──
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

# أيقونة التطبيق — بتتولّد لكل مقاسات أندرويد و iOS من صورة واحدة.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFD200"
  adaptive_icon_foreground: "assets/icon/icon.png"
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-500.ttf
          weight: 500
        - asset: assets/fonts/Outfit-600.ttf
          weight: 600
        - asset: assets/fonts/Outfit-700.ttf
          weight: 700
        - asset: assets/fonts/Outfit-800.ttf
          weight: 800
