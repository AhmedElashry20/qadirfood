org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin in-process — بيتجنّب فشل «Could not connect to Kotlin compile daemon»
# تحت ضغط الذاكرة (بدل daemon منفصل لازم يتوصل بيه). أأمن على أجهزة التطوير.
kotlin.compiler.execution.strategy=in-process
# heap أقل شوية عشان يسيب مساحة للـ simulator/السيرفر الشغّالين
org.gradle.workers.max=4
