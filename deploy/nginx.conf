# قادر فود (Qadir Food) — إعداد Nginx كواجهة عكسية + HTTPS
# بيتركّب على المسار: /etc/nginx/conf.d/default.conf (شوف docker-compose.prod.yml)
#
# قبل التشغيل:
#   1) غيّر api.qadirfood.sa لدومينك الحقيقي في المكانين تحت (server_name + مسارات الشهادة).
#   2) أصدر شهادة Let's Encrypt أول مرة (شوف docs/08-production-runbook.md §3).
#   3) أعد تحميل: docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

# مجمّع الباك إند (الـ API على الشبكة الداخلية للـ compose)
upstream qadir_api {
    server api:3000;
    keepalive 32;
}

# ── HTTP :80 — تحدّي ACME + إعادة توجيه كل شيء لـ HTTPS ─────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.qadirfood.sa;

    # certbot webroot — لازم تفضل على HTTP عشان تجديد الشهادة يشتغل من غير إيقاف.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # أي شيء تاني → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — الواجهة الفعلية ───────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.qadirfood.sa;

    # شهادة Let's Encrypt (بدّل الدومين بدومينك)
    ssl_certificate     /etc/letsencrypt/live/api.qadirfood.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qadirfood.sa/privkey.pem;

    # إعدادات TLS آمنة (TLS 1.2/1.3 فقط)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ترويسات أمان
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # الحد الأقصى لحجم الرفع — صور المتاجر ووثائق/سيلفي الكابتن.
    client_max_body_size 15m;

    # ضغط الردود النصية (JSON) — الصور مش محتاجة.
    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 1024;

    # ترويسات proxy مشتركة
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # ── Socket.IO — التتبّع اللحظي وإشعارات الطلبات (ترقية WebSocket) ──────────
    # لازم قبل / عشان الـ Upgrade/Connection يتحطّوا صح ومهلة القراءة تطول.
    location /socket.io/ {
        proxy_pass http://qadir_api;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── الملفات المرفوعة (تُقدَّم من الـ API على /uploads) ─────────────────────
    # ملاحظة أداء: لو ربطت volume الرفع على nginx مباشرة تقدر تقدّمها بـ
    #   root/alias بدل proxy. حالياً بنوجّهها للـ API (أبسط، وبيشتغل مع S3 لاحقاً).
    location /uploads/ {
        proxy_pass http://qadir_api;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
        # مهم: أي location فيه add_header بيوقف وراثة add_header من مستوى السيرفر،
        # فلازم نكرّر ترويسات الأمان هنا وإلا الملفات المرفوعة تتقدّم من غيرها.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── REST API ──────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://qadir_api;
    }

    # ── فحص الصحة (مستثنى من بادئة /api) ───────────────────────────────────────
    location = /health {
        proxy_pass http://qadir_api;
        access_log off;
    }

    # ── الباقي (Swagger على /docs لو مفعّل، إلخ) → الـ API ──────────────────────
    location / {
        proxy_pass http://qadir_api;
    }
}
